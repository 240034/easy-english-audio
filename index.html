<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy English Audio</title>
  <!-- Современный шрифт для удобного чтения -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .player-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 450px;
    }
    h1 {
      font-size: 24px;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 24px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .category {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 4px;
    }
    h3 {
      font-size: 20px;
      color: #2563eb;
      margin-top: 0;
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="player-card">
    <h1>Easy English Audio</h1>

    <div class="category">My World</div>
    <h3>01. My Family</h3>

    <!-- Исправленный тег аудио с прямой ссылкой -->
    <audio controls src="./01_My_Family.mp3">
      Your browser does not support audio.
    </audio>
  </div>

</body>
</html>
