<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy English Audio — Home</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .menu-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 450px;
    }
    h1 {
      font-size: 24px;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 24px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
      text-align: center;
    }
    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      font-weight: 600;
      color: #64748b;
      margin: 20px 0 10px 0;
    }
    .lessons-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .lessons-list li {
      margin-bottom: 10px;
    }
    .lesson-link {
      display: block;
      padding: 12px 16px;
      background: #f1f5f9;
      color: #2563eb;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
    }
    .lesson-link:hover {
      background: #e2e8f0;
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="menu-card">
    <h1>🎧 Easy English Audio</h1>
    
    <div class="section-title">My World</div>
    <ul class="lessons-list">
      <!-- Ссылка ведет на отдельный файл family.html -->
      <li><a class="lesson-link" href="family.html">👉 01. My Family</a></li>
      <!-- Ссылка на будущий второй урок -->
      <li><a class="lesson-link" href="friend.html">👉 02. My Best Friend</a></li>
    </ul>
  </div>

</body>
</html>
